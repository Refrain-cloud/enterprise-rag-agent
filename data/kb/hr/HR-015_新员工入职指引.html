<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>新员工入职指引</title></head><body>
<h1>新员工入职指引</h1>
<p>欢迎加入北辰智造。请按以下清单完成入职。</p>
<h2>报到当天需携带</h2>
<ul><li>身份证原件及复印件</li><li>学历学位证书</li><li>离职证明</li><li>银行卡（工资卡）</li><li>一寸照片 2 张</li></ul>
<h2>入职流程</h2>
<ol><li>前台登记，领取工牌与门禁卡</li><li>HR 签署劳动合同、保密协议</li><li>IT 领取电脑，开通账号（见《账号开通流程》）</li><li>导师带领熟悉团队与办公区</li></ol>
<h2>第一周要做的事</h2>
<ul><li>完成信息安全培训（必修）</li><li>加入部门企业微信群</li><li>阅读《员工手册》并签署确认页</li><li>与导师确认 3 个月试用期目标</li></ul>
</body></html>
